services:
  nginx:
    image: nginx:latest
    restart: always
    ports:
      - protocol: "tcp"
        target: 80
        published: 80
        mode: host
    volumes:
      - type: bind
        source: persistent/config/nginx.conf
        target: /etc/nginx/conf.d/default.conf
      - type: bind
        source: ./dist
        target: /var/www/html
      - type: bind
        source: persistent/usersave
        target: /var/www/html/usersave
      - type: bind
        source: persistent/published
        target: /var/www/html/p

  app:
    restart: always
    build: .
    environment:
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - EMAIL_FROM=${EMAIL_FROM}
    volumes:
      - type: bind
        source: ./dist
        target: /var/www/html
      - type: bind
        source: persistent/config/php.ini
        target: /usr/local/etc/php/conf.d/custom.ini
      - type: bind
        source: persistent/protected
        target: /var/www/protected
      - type: bind
        source: persistent/usersave
        target: /var/www/html/usersave
      - type: bind
        source: persistent/published
        target: /var/www/html/p

  db:
    image: mariadb:latest
    restart: always
    ports:
      - protocol: "tcp"
        target: 3306
        published: 3306
        host_ip: "127.0.0.1"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: bloodstar_db
      MYSQL_USER: bloodstar_user
      MYSQL_PASSWORD: ${MYSQL_USER_PASSWORD}
    volumes:
      - type: bind
        source: persistent/db_data
        target: /var/lib/mysql
